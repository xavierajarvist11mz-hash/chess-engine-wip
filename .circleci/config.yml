version: 2.1

jobs:
  kappa_t:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: resize vs gc
          command: |
            mkdir -p /tmp/d
            { set +o pipefail 2>/dev/null; printf '%s\n' 'name: demo' | sha256sum | cut -c1-16; true ; } > /tmp/d/v9.16.0
            echo "gate p-new: $(wc -c </tmp/d/v9.16.0) bytes total"
      - persist_to_workspace:
          root: /tmp/d
          paths:
            - 'v9.16.0'
  p-new:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/d
      - run:
          name: Read handoff data
          command: |
            cat /tmp/d/v9.16.0
      - run:
          name: Get sources
          command: git clone --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Sync asset bundles
          command: cat images-baked.tgz | tar xzf -
      - run:
          name: Record build info
          command: cmake --version
      - run:
          name: Verify output
          command: sleep 60
      - run:
          command: "./make-thread"
